name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5 # 升级以消除 Node.js 20 警告

    - name: Set up JDK 17
      uses: actions/setup-java@v5 # 明确修复 setup-java v4 弃用警告
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew :androidApp:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v5 # 升级以消除 Node.js 20 警告
      with:
        name: android-debug-apk
        path: androidApp/build/outputs/apk/debug/**/*.apk
